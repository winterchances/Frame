name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: ''

    - name: Prepare Web Directory
      run: |
        mkdir www
        mv index.html www/

    - name: Install Capacitor & Assets
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install @capacitor/assets
        npx cap init "影匣" "com.mycine.app" --web-dir=www
        npx cap add android

    - name: Prepare App Icon
      run: |
        mkdir -p assets
        mv *.png assets/icon.png || true

    - name: Generate App Icons
      run: |
        npx capacitor-assets generate --android

    - name: Build APK with Gradle
      run: |
        npx cap sync
        cd android
        # 极客清理大法：清理可能损坏的缓存
        rm -rf ~/.gradle/caches/
        chmod +x gradlew
        # 加上 --no-daemon 和 --stacktrace 防止后台进程冲突
        ./gradlew clean assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyCinema-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
