name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 1. 明确安装 JDK 21
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # 2. 强制指定 Gradle 使用 JDK 21
    - name: Setup Gradle JDK
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        # 将 JAVA_HOME 写入 gradle.properties，确保 Gradle 使用 JDK 21
        echo "org.gradle.java.home=$JAVA_HOME" >> $GITHUB_WORKSPACE/gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: ''

    - name: Prepare Web Directory
      run: |
        mkdir www
        mv index.html www/

    - name: Install Capacitor & Assets
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npm install @capacitor/assets
        npx cap init "影匣" "com.mycine.app" --web-dir=www
        npx cap add android

    - name: Prepare App Icon
      run: |
        mkdir -p assets
        mv *.png assets/icon.png || true

    - name: Generate App Icons
      run: |
        npx capacitor-assets generate --android

    - name: Build APK with Gradle
      run: |
        npx cap sync
        cd android
        rm -rf ~/.gradle/caches/
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyCinema-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
