name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 锁定 Node.js 22（Capacitor 最新要求）
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 2. 锁定 Java JDK 21 和 Temurin 发行版
    - name: Setup Java JDK
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        echo "org.gradle.java.home=$JAVA_HOME" >> $GITHUB_WORKSPACE/gradle.properties

    # 3. 强制 Gradle 使用 Java 21
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Prepare Web Directory
      run: |
        mkdir www
        mv index.html www/

    # 4. 安装 Capacitor 时自动匹配最新版，避免版本错位
    - name: Install Capacitor & Assets
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npm install @capacitor/assets
        npx cap init "影匣" "com.mycine.app" --web-dir=www
        npx cap add android

    - name: Prepare App Icon
      run: |
        mkdir -p assets
        mv *.png assets/icon.png || true

    - name: Generate App Icons
      run: |
        npx capacitor-assets generate --android

    # 5. 清理缓存并构建
    - name: Build APK with Gradle
      run: |
        npx cap sync
        cd android
        rm -rf ~/.gradle/caches/
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyCinema-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
