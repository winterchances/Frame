name: Build Native Android APK

on:
  push:
    branches: [ "parity-fixes" ]
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Install and diagnose app startup in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.frame.cinema
            adb shell am start -n com.frame.cinema/.MainActivity
            sleep 15
            echo "===== APP PROCESS ====="
            adb shell pidof com.frame.cinema
            echo "===== LAST ANR ====="
            adb shell dumpsys activity lastanr
            echo "===== MAIN THREAD DUMP ====="
            adb shell kill -3 $(adb shell pidof com.frame.cinema) || true
            sleep 2
            adb logcat -d -v threadtime > startup-logcat.txt
            echo "===== APP STARTUP / ANR / CRASH SUMMARY ====="
            grep -E -A 45 -B 8 "FATAL EXCEPTION|Fatal signal|ANR in Window|ANR\ in\ com.frame.cinema|DALVIK THREADS|"main" prio|Process: com.frame.cinema|com.frame.cinema" startup-logcat.txt | tail -n 500 || true

      - name: Upload APK and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frame-native-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            startup-logcat.txt
          if-no-files-found: ignore
